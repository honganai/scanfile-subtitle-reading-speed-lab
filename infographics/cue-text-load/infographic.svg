<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1760" viewBox="0 0 1200 1760" role="img" aria-labelledby="title desc">
<title id="title">Same two seconds, different text load</title><desc id="desc">Three synthetic English and German subtitle phrase pairs share a two-second cue. Grapheme counts and rates are shown with a common zero-based scale. No audience study, language-wide expansion ratio or universal speed limit is claimed.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17283b}.eyebrow{font-size:20px;font-weight:700;letter-spacing:2px}.hero{font-size:70px;font-weight:750;letter-spacing:-2px}.lead{font-size:28px}.heading{font-size:29px;font-weight:700}.body{font-size:23px}.small{font-size:19px}.tiny{font-size:17px}.number{font-size:25px;font-weight:700}.white{fill:white}.muted{fill:#4b6075}.mono{font-family:monospace;font-size:24px}</style>
<rect x="0" y="0" width="1200" height="1760" fill="#fff" rx="0" /><rect x="0" y="0" width="1200" height="350" fill="#17283b" rx="0" />
<text x="64" y="59" class="eyebrow white" >SUBTITLE WORKFLOW · SYNTHETIC EXAMPLES</text>
<text x="64" y="151" class="hero white" >Same 2 seconds.</text><text x="64" y="232" class="hero white" >Different text load.</text>
<text x="64" y="299" class="lead white" >Why a translated cue needs a fresh timing check</text>
<rect x="56" y="385" width="1088" height="170" fill="#f3f6f9" rx="20" /><text x="86" y="429" class="eyebrow" >EVERY EXAMPLE USES THE SAME CUE WINDOW</text>
<text x="86" y="477" class="mono" >00:00:10,000</text><text x="615" y="477" class="mono" >00:00:12,000</text>
<path d="M 300 469 H 585 M 574 461 L 585 469 L 574 477" fill="none" stroke="#087f8c" stroke-width="3"/>
<text x="86" y="521" class="body" >Text density = counted graphemes ÷ 2.0 seconds</text>
<text x="64" y="610" class="heading" >Selected phrases — not a language-wide rule</text>
<rect x="66" y="635" width="20" height="20" fill="#087f8c" rx="4" /><text x="98" y="653" class="small" >Illustrative English phrase</text>
<rect x="562" y="635" width="20" height="20" fill="#7043ad" rx="4" /><text x="594" y="653" class="small" >Illustrative German phrase</text><rect x="56" y="687" width="1088" height="154" fill="#f3f6f9" rx="12" /><text x="83" y="725" class="body" >Try again.</text><text x="83" y="774" class="body" >Versuche es noch einmal.</text><rect x="570" y="704" width="200" height="27" fill="#087f8c" rx="4" /><text x="780" y="725" class="number" >5.0</text><rect x="570" y="753" width="480" height="27" fill="#7043ad" rx="4" /><text x="1060" y="774" class="number" >12.0</text><text x="83" y="812" class="small" >10 → 24 graphemes; duration stays 2.0 s</text><text x="83" y="896" class="body" >Save the file.</text><text x="83" y="945" class="body" >Speichere die Datei.</text><rect x="570" y="875" width="280" height="27" fill="#087f8c" rx="4" /><text x="860" y="896" class="number" >7.0</text><rect x="570" y="924" width="400" height="27" fill="#7043ad" rx="4" /><text x="980" y="945" class="number" >10.0</text><text x="83" y="983" class="small" >14 → 20 graphemes; duration stays 2.0 s</text><rect x="56" y="1029" width="1088" height="154" fill="#f3f6f9" rx="12" /><text x="83" y="1067" class="body" >Done.</text><text x="83" y="1116" class="body" >Fertig.</text><rect x="570" y="1046" width="100" height="27" fill="#087f8c" rx="4" /><text x="680" y="1067" class="number" >2.5</text><rect x="570" y="1095" width="140" height="27" fill="#7043ad" rx="4" /><text x="720" y="1116" class="number" >3.5</text><text x="83" y="1154" class="small" >5 → 7 graphemes; duration stays 2.0 s</text><path d="M 570 687 V 1197 H 1050" fill="none" stroke="#90a2b4" stroke-width="1.5"/><path d="M 570 1197 v 9" stroke="#90a2b4"/><text x="570" y="1229" class="small" text-anchor="middle">0</text><path d="M 730 1197 v 9" stroke="#90a2b4"/><text x="730" y="1229" class="small" text-anchor="middle">4</text><path d="M 890 1197 v 9" stroke="#90a2b4"/><text x="890" y="1229" class="small" text-anchor="middle">8</text><path d="M 1050 1197 v 9" stroke="#90a2b4"/><text x="1050" y="1229" class="small" text-anchor="middle">12</text><text x="810" y="1257" class="small" text-anchor="middle">Graphemes per second</text><text x="64" y="1315" class="heading" >Keep the timing check separate from translation</text><rect x="64" y="1340" width="345" height="102" fill="#f3f6f9" rx="14" /><text x="81" y="1375" class="number" >1 · Translate</text><text x="81" y="1413" class="small" >Keep a copy of the source.</text><rect x="427" y="1340" width="345" height="102" fill="#f3f6f9" rx="14" /><text x="444" y="1375" class="number" >2 · Recalculate</text><text x="444" y="1413" class="small" >Check text against cue time.</text><rect x="790" y="1340" width="345" height="102" fill="#f3f6f9" rx="14" /><text x="807" y="1375" class="number" >3 · Watch the video</text><text x="807" y="1413" class="small" >Check meaning, flow and sync.</text><text x="64" y="1480" class="body" >If a cue is too dense, edit the wording or re-time only where audio and context allow.</text><text x="64" y="1520" class="small" >Counts include spaces and punctuation. No universal reading-speed limit is shown.</text><text x="64" y="1550" class="small" >Toy text is not a viewer study, a translation-quality test or accessibility certification.</text><path d="M 64 1582 H 1136" stroke="#cfdae4"/><text x="64" y="1613" class="tiny" >Method: existing open-source lab, Intl.Segmenter grapheme counts; reproducible JSON included.</text><text x="64" y="1640" class="tiny" >Background: w3.org/TR/webvtt1/ (cue timing) · unicode.org/reports/tr29/ (text segmentation)</text><text x="64" y="1677" class="small" >Scanfile workflow lab · AI-assisted original illustration · MIT license · scanfile.online</text><text x="64" y="1711" class="tiny" >No real user subtitles, borrowed artwork, performance claims or endorsement badges.</text></svg>
